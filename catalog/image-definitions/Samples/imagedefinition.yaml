$schema: "1.0"
name: "WithEditAndTerminal-eng"
image: microsoftvisualstudio_visualstudioplustools_vs-2022-ent-general-win11-m365-gen2
description: "This definition is a test image engineering environment"

tasks:
  - name: ~/winget
    parameters:
      downloadUrl: 'https://raw.githubusercontent.com/contoso-co/common-eng-sys/msft-git/dsc-configurations/common-config.dsc.yaml'

  - name: ~/winget
    description: Install AZD
    parameters:
      package:  Microsoft.Azd
      scope: machine
      silent: true      

  - name: ~/winget
    description: Install WindowsTerminalPreview
    parameters:
      package:  Microsoft.WindowsTerminal.Preview
      scope: machine
      silent: true

  - name: ~/winget
    description: Install Edit
    parameters:
      package:  Microsoft.Edit
      scope: machine
      silent: true

  - name: ~/winget
    description: Install Visual Studio Code
    parameters:
      package:  Microsoft.VisualStudioCode
      scope: machine
      silent: true

  - name: ~/winget
    description: Install Visual Studio Code Insiders
    parameters:
      package:  Microsoft.VisualStudioCode.Insiders
      scope: machine
      silent: true

  - name: ~/winget
    description: Install Python version 3.13
    parameters:
      package:  Python.Python.3.13
      scope: machine
      silent: true

  - name: ~/powershell
    parameters:
      command: |
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User') 
